version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: junctionai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: junction_ai_db
      MYSQL_USER: itcs_user
      MYSQL_PASSWORD: itcs_secure_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: junctionai-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: junctionai_super_secret_ekpo_abasi_2026_key
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: itcs_user
      DB_PASSWORD: itcs_secure_password_2026
      DB_NAME: junction_ai_db
      SIM_DEFAULT_INTERVAL_MS: 3000
      EMERGENCY_MAX_DURATION_SECONDS: 30
      PEDESTRIAN_WALK_DURATION_SECONDS: 15
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
